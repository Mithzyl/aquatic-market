# Nginx 反向代理配置 - 海鲜零售预订系统
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css text/xml;

    # Docker DNS 解析器
    resolver 127.0.0.11 valid=30s ipv6=off;

    # HTTP (80)
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 商户端 API
        location /api/merchant/ {
            set $merchant_backend merchant-service:8001;
            proxy_pass http://$merchant_backend/api/merchant/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # 用户端 API
        location /api/customer/ {
            set $customer_backend customer-service:8002;
            proxy_pass http://$customer_backend/api/customer/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # 平台端 API
        location /api/platform/ {
            set $platform_backend platform-service:8003;
            proxy_pass http://$platform_backend/api/platform/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }
    }
}
