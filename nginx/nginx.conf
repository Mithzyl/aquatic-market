# ============================================================
# Nginx 反向代理配置 - 海鲜零售预订系统
# 三服务架构：merchant(8001) + customer(8002) + platform(8003)
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain application/json application/javascript text/css text/xml;

    # ==================== 上游服务定义 ====================
    upstream merchant_backend {
        server merchant-service:8001;
    }

    upstream customer_backend {
        server customer-service:8002;
    }

    upstream platform_backend {
        server platform-service:8003;
    }

    # ==================== HTTP (80) ====================
    server {
        listen 80;
        server_name _;

        # 前端静态文件（由 Nginx 直接托管）
        # 注意：需要 docker-compose.yml 中添加 volume 挂载：
        #   - ./frontend/dist:/usr/share/nginx/html:ro
        root /usr/share/nginx/html;
        index index.html;

        # SPA 路由回退：非 API 和非文件请求全部返回 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---- 商户端 API ----
        location /api/merchant/ {
            proxy_pass http://merchant_backend/api/merchant/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ---- 用户端 API ----
        location /api/customer/ {
            proxy_pass http://customer_backend/api/customer/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ---- 平台端 API ----
        location /api/platform/ {
            proxy_pass http://platform_backend/api/platform/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # ==================== HTTPS (443) ====================
    # 生产环境请替换为正式 SSL 证书
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/merchant/ {
            proxy_pass http://merchant_backend/api/merchant/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/customer/ {
            proxy_pass http://customer_backend/api/customer/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/platform/ {
            proxy_pass http://platform_backend/api/platform/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
